<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="60" rx="28" fill="url(#gloss)"/>

  <!-- signal waves -->
  <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 40 52 A 34 34 0 0 1 88 52" opacity="0.55"/>
    <path d="M 50 60 A 20 20 0 0 1 78 60" opacity="0.8"/>
  </g>

  <!-- cursor arrow (remote control pointer) -->
  <g>
    <path d="M 64 62 L 64 98 L 73 88 L 80 102 L 88 98 L 81 85 L 94 84 Z"
          fill="#ffffff" stroke="#312e81" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- connection dot -->
  <circle cx="64" cy="58" r="6" fill="#ffffff"/>
</svg>
