<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; margin: 0; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    .row { margin: 8px 0; }
    input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; }
    #save { background: #2563eb; color: #fff; }
    #reconnect { background: #e5e7eb; }
    #status { padding: 8px; border-radius: 6px; font-size: 13px; }
    .on  { background: #dcfce7; color: #166534; }
    .off { background: #f3f4f6; color: #6b7280; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 2px; }
    #deviceLabel { font-size: 12px; color: #2563eb; margin-top: 2px; }
  </style>
</head>
<body>
  <h3>Hermes Remote Control</h3>
  <div id="status" class="off">Checking…</div>
  <div class="row">
    <label>设备名 (Device name)</label>
    <input id="deviceName" placeholder="例如：书房台式机 / 客厅笔记本">
    <div id="deviceLabel"></div>
  </div>
  <div class="row">
    <label>Relay server</label>
    <input id="serverUrl" placeholder="ws://127.0.0.1:8765">
  </div>
  <button id="save">Save</button>
  <button id="reconnect">Reconnect</button>
  <script src="popup.js"></script>
</body>
</html>
